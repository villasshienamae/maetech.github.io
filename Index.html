<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiena Mae Villas-Saguran | MaeTech Solutions</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111827;
            --bg-card: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #00d2ff;
            --accent-secondary: #3a7bd5;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-glow: rgba(0, 210, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s ease;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* --- GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-padding {
            padding: 6rem 0;
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 3.5rem auto;
            font-size: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .brand-logo {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo i {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-primary);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 100px;
            position: relative;
            background: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.05) 0%, transparent 40%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 50px;
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            margin-bottom: 1.5rem;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .hero-title {
            font-size: 3.25rem;
            line-height: 1.15;
            font-weight: 800;
            margin-bottom: 1.25rem;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .hero-cta {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .stat-item h3 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-primary);
            font-family: var(--font-mono);
        }

        .stat-item p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hero-image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .profile-card {
            position: relative;
            width: 100%;
            max-width: 360px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .profile-img-container {
            width: 100%;
            height: 320px;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 1.25rem;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-img-placeholder {
            font-size: 5rem;
            color: var(--accent-primary);
        }

        .profile-meta h4 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .profile-meta p {
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-family: var(--font-mono);
        }

        /* --- ABOUT SECTION --- */
        .about-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .about-text h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-size: 0.98rem;
        }

        .highlights-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .highlight-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            background: var(--bg-card);
            padding: 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .highlight-item i {
            color: var(--accent-primary);
            margin-top: 3px;
        }

        /* --- SERVICES SECTION --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .service-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2.25rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .service-icon {
            width: 55px;
            height: 55px;
            background: rgba(0, 210, 255, 0.1);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent-primary);
            margin-bottom: 1.5rem;
        }

        .service-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* --- SKILLS SECTION --- */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .skill-category {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: var(--radius-md);
        }

        .skill-category h3 {
            font-size: 1.15rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-primary);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .tag {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            transition: var(--transition);
        }

        .tag:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: scale(1.03);
        }

        /* --- EXPERIENCE & PORTFOLIO --- */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            padding-left: 60px;
            margin-bottom: 2.5rem;
        }

        .timeline-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            font-size: 0.9rem;
        }

        .timeline-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.75rem;
            border-radius: var(--radius-md);
        }

        .timeline-date {
            font-size: 0.8rem;
            font-family: var(--font-mono);
            color: var(--accent-primary);
            margin-bottom: 0.25rem;
        }

        .timeline-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .timeline-company {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .timeline-body p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* --- CONTACT SECTION --- */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem;
        }

        .contact-info-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .contact-icon {
            width: 45px;
            height: 45px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            font-size: 1.1rem;
        }

        .contact-details h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .contact-details p, .contact-details a {
            font-size: 1rem;
            font-weight: 600;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        /* --- FOOTER --- */
        footer {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-socials {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-bottom: 1rem;
        }

        .footer-socials a {
            width: 38px;
            height: 38px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .footer-socials a:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-3px);
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 992px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-description {
                margin: 0 auto 2rem auto;
            }

            .hero-cta {
                justify-content: center;
            }

            .stats-grid {
                max-width: 500px;
                margin: 0 auto;
            }

            .about-content {
                grid-template-columns: 1fr;
            }

            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 80px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 80px);
                background: var(--bg-primary);
                flex-direction: column;
                justify-content: center;
                transition: var(--transition);
            }

            .nav-links.active {
                left: 0;
            }

            .hamburger {
                display: block;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .section-padding {
                padding: 4rem 0;
            }

            .about-content, .contact-wrapper {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <a href="#" class="brand-logo">
                <i class="fa-solid fa-terminal"></i>
                <span>MaeTech<span class="gradient-text">Solutions</span></span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#services" class="nav-link">Services</a></li>
                <li><a href="#skills" class="nav-link">Skills & Stack</a></li>
                <li><a href="#experience" class="nav-link">Experience</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero" id="hero">
        <div class="container">
            <div class="hero-grid">
                <div class="hero-text-content">
                    <div class="badge">
                        <span class="badge-dot"></span> Available for IT Consulting & Projects
                    </div>
                    <h1 class="hero-title">
